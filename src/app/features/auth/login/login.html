<section class="auth-shell">
  <div class="auth-card">
    <div class="brand-block">
      <h1>{{ pageTitle }}</h1>
      <p>Sign in to continue to your workspace.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" class="auth-form">
      <label>
        <span>Email</span>
        <input formControlName="emailId" type="email" placeholder="name@example.com" />
      </label>

      <label class="password-label">
        <span>Password</span>
        <div class="password-input-wrapper">
          <input 
            formControlName="password" 
            [type]="hidePassword ? 'password' : 'text'" 
            placeholder="Enter password" />
          <button 
            type="button" 
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'">
            {{ hidePassword ? '👁️' : '🙈' }}
          </button>
        </div>
      </label>

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Signing in...' : 'Login' }}
      </button>
    </form>

    <div class="swap-login">
      <button type="button" class="swap-btn" (click)="swapLoginType()">
        Switch to {{ userType === 'ADMIN' ? 'Customer' : 'Admin' }} Login
      </button>
      <button type="button" class="forgot-password-btn" (click)="forgotPassword()">Forgot Password</button>
    </div>
  </div>
</section>
