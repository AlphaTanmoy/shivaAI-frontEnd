<div class="two-factor-page">

  <h1>Two Factor Authentication</h1>

  <p>Please select a delivery channel to receive your OTP.</p>

  <app-single-select-dropdown
    label="Delivery channel"
    placeholder="Select a channel"
    [options]="options"
    [selectedValue]="selectedChannel"
    (selectionChange)="onChannelSelected($event)">
  </app-single-select-dropdown>

  <div class="actions">

    <button
      type="button"
      (click)="sendOtp()"
      [disabled]="loading || !selectedChannel || countdown > 0">

      {{ loading
          ? 'Sending...'
          : countdown > 0
              ? ('Resend OTP in ' + countdown + 's')
              : 'Send OTP' }}

    </button>

    <button
      type="button"
      (click)="openOtpEntry()">

      Already Have OTP

    </button>

  </div>

  <section
    *ngIf="showOtpEntry"
    class="otp-entry">

    <h2>Enter your OTP</h2>

    <div class="otp-boxes">

      <input
        *ngFor="let box of otpBoxes; let i = index; trackBy: trackByIndex"
        #otpInput
        class="otp-box"
        type="text"
        inputmode="numeric"
        maxlength="1"
        autocomplete="off"
        spellcheck="false"

        [value]="box"

        (focus)="onOtpBoxFocus(i)"
        (input)="onOtpBoxChange($event, i)"
        (keydown)="onOtpKeyDown($event, i)"
        (paste)="onOtpBoxPaste($event)" />

    </div>

    <button
      type="button"
      (click)="submitOtp()"
      [disabled]="loading || !isOtpComplete">

      {{ loading ? 'Verifying...' : 'Verify OTP' }}

    </button>

  </section>

</div>
